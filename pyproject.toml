[project]
name = "task2pr"
version = "0.1.0"
description = "Agentic automation: Wrike task -> code change -> GitHub PR"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "requests>=2.31",
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "requests-mock>=1.12",
    "httpx>=0.27",
]

[project.scripts]
task2pr = "task2pr.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["task2pr*"]
